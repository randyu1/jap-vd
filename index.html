<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: url('blue_flowers_green_leaves_white_background_hd_preppy.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #root {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .messages-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .message {
            display: flex;
            align-items: flex-end;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-bubble {
            background: white;
            padding: 12px 18px;
            border-radius: 20px;
            max-width: 80%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-size: 18px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 18px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.7; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        .gif-container {
            width: 100%;
            max-width: 300px;
            margin-top: 20px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .gif-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .buttons-container {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            position: relative;
            min-height: 120px;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn-yes {
            background: #FF69B4;
            color: white;
        }

        .btn-yes:hover {
            background: #FF1493;
            transform: scale(1.05);
        }

        .btn-no {
            background: white;
            color: #666;
        }

        .btn-no:hover {
            background: #f0f0f0;
        }

        .btn-no.moving {
            position: fixed;
            transition: all 0.15s ease-out;
        }

        .btn-placeholder {
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            visibility: hidden;
        }

        .success-message {
            text-align: center;
            position: relative;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -15vh;
        }

        .quote-section {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @media (max-width: 768px) {
            .success-message {
                margin-top: -10vh;
            }

            .success-message-img-wrapper::before,
            .success-message-img-wrapper::after {
                display: none;
            }

            .fireworks {
                display: none;
            }

            .quote-section {
                position: fixed;
                top: auto;
                bottom: 40px;
                left: 50%;
                transform: translateX(-50%);
                width: 90%;
                max-width: 350px;
            }

            .typing-text,
            .poem-button {
                font-size: 14px;
                white-space: nowrap;
            }

            .typing-text {
                min-height: 24px;
            }
        }

        .success-message-img-wrapper {
            position: relative;
            display: inline-block;
            padding: 40px;
        }

        .success-message-img-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center, transparent 0%, transparent 50%, rgba(252, 254, 252, 0.8) 75%, #fcfefc 100%);
            pointer-events: none;
            z-index: 2;
            filter: blur(20px);
        }

        .success-message-img-wrapper::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            background: radial-gradient(ellipse at center, transparent 40%, #fcfefc 80%);
            pointer-events: none;
            z-index: 1;
            filter: blur(30px);
        }

        .success-message img {
            max-width: 400px;
            width: 100%;
            height: auto;
            animation: popIn 0.5s ease-out;
            display: block;
            position: relative;
            z-index: 3;
            border-radius: 20px;
        }

        .success-message p {
            font-size: 32px;
            color: #2E6F40;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8), -1px -1px 2px rgba(255, 255, 255, 0.6), 0 0 15px rgba(252, 254, 252, 0.5);
            margin-top: 30px;
            padding: 10px 20px;
        }

        .music-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            opacity: 0;
            pointer-events: none;
            width: 1px;
            height: 1px;
        }

        .typing-text {
            font-size: 15px;
            color: #2E6F40;
            font-weight: bold;
            text-align: center;
            margin-top: 30px;
            min-height: 40px;
        }

        .typing-text .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background-color: #2E6F40;
            margin-left: 2px;
            animation: blink 0.7s infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .poem-button {
            font-size: 15px;
            color: #2E6F40;
            font-weight: bold;
            text-align: center;
            margin-top: 30px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px 20px;
            transition: opacity 0.3s ease;
        }

        .poem-button:hover {
            opacity: 0.7;
        }

        .poem-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.5s ease-out;
        }

        .poem-container {
            background: white;
            max-width: 450px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .poem-container p {
            font-size: 16px;
            color: #333;
            line-height: 1.8;
            text-align: left;
            white-space: pre-line;
            font-style: italic;
        }

        .back-button {
            margin-top: 20px;
            background: white;
            border: none;
            color: #666;
            font-size: 14px;
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: opacity 0.3s ease;
        }

        .back-button:hover {
            opacity: 0.8;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .firework {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: explode 2s ease-out infinite;
            opacity: 0;
        }

        .firework.red {
            background: #FF1744;
            box-shadow: 0 0 20px 8px #FF1744, 0 0 40px 12px rgba(255, 23, 68, 0.6), 0 0 60px 16px rgba(255, 23, 68, 0.3);
        }

        .firework.blue {
            background: #2979FF;
            box-shadow: 0 0 20px 8px #2979FF, 0 0 40px 12px rgba(41, 121, 255, 0.6), 0 0 60px 16px rgba(41, 121, 255, 0.3);
        }

        .firework.green {
            background: #00E676;
            box-shadow: 0 0 20px 8px #00E676, 0 0 40px 12px rgba(0, 230, 118, 0.6), 0 0 60px 16px rgba(0, 230, 118, 0.3);
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(0); opacity: 0; }
            10% { transform: translate(0, 0) scale(1); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0.3); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        function ValentineApp() {
            const [showTyping1, setShowTyping1] = useState(true);
            const [showMessage1, setShowMessage1] = useState(false);
            const [showTyping2, setShowTyping2] = useState(false);
            const [showMessage2, setShowMessage2] = useState(false);
            const [showButtons, setShowButtons] = useState(false);
            const [noClickCount, setNoClickCount] = useState(0);
            const [accepted, setAccepted] = useState(false);
            const [isMobile, setIsMobile] = useState(false);
            const [noButtonPos, setNoButtonPos] = useState({ top: 0, left: 0 });
            const [noButtonHovered, setNoButtonHovered] = useState(false);
            const [showMusicButton, setShowMusicButton] = useState(false);
            const [showTypingAnimation, setShowTypingAnimation] = useState(false);
            const [typedText, setTypedText] = useState('');
            const [typingComplete, setTypingComplete] = useState(false);
            const [showPoem, setShowPoem] = useState(false);
            const audioRef = useRef(null);
            const musicButtonRef = useRef(null);

            const poem = `I hate the way you talk to me
And the way you cut your hair
I hate the way you drive my car
I hate it when you stare
I hate your big dumb combat boots
And the way you read my mind
I hate you so much that it makes me sick
And even makes me rhyme
I hate the way you're always right
I hate it when you lie
I hate it when you make me laugh
Even worse when you make me cry
I hate it when you're not around
And the fact that you didn't call
But mostly I hate the way I don't hate you
Not even close
Not even a little bit
Not even at all`;

            useEffect(() => {
                const checkMobile = () => setIsMobile(window.innerWidth < 768);
                checkMobile();
                window.addEventListener('resize', checkMobile);
                return () => window.removeEventListener('resize', checkMobile);
            }, []);

            useEffect(() => {
                if (showMusicButton && musicButtonRef.current) {
                    setTimeout(() => musicButtonRef.current.click(), 100);
                }
            }, [showMusicButton]);

            useEffect(() => {
                if (showTypingAnimation && !typingComplete) {
                    const textToType = "I hate the way you're always right";
                    let currentIndex = 0;
                    const typingInterval = setInterval(() => {
                        if (currentIndex < textToType.length) {
                            setTypedText(textToType.substring(0, currentIndex + 1));
                            currentIndex++;
                        } else {
                            clearInterval(typingInterval);
                            setTypingComplete(true);
                        }
                    }, 80);
                    return () => clearInterval(typingInterval);
                }
            }, [showTypingAnimation]);

            useEffect(() => {
                const timer1 = setTimeout(() => { setShowTyping1(false); setShowMessage1(true); }, 2500);
                const timer2 = setTimeout(() => setShowTyping2(true), 3000);
                const timer3 = setTimeout(() => { setShowTyping2(false); setShowMessage2(true); }, 5500);
                const timer4 = setTimeout(() => setShowButtons(true), 6000);
                return () => { clearTimeout(timer1); clearTimeout(timer2); clearTimeout(timer3); clearTimeout(timer4); };
            }, []);

            const playMusic = () => {
                const songs = [
                    './back ground music/Song1.mp3',
                    './back ground music/Song2.mp3'
                ];
                const audio = new Audio(songs[Math.floor(Math.random() * songs.length)]);
                audio.volume = 0.7;
                audio.loop = true;
                audio.play()
                    .then(() => { setShowMusicButton(false); audioRef.current = audio; })
                    .catch(() => setShowMusicButton(true));
            };

            const handleYesClick = () => {
                setAccepted(true);
                playMusic();
                setTimeout(() => setShowTypingAnimation(true), 4000);
            };

            const handleNoClick = () => {
                if (isMobile) setNoClickCount(prev => prev + 1);
            };

            const handleNoHover = () => {
                if (!isMobile) {
                    setNoButtonHovered(true);
                    const padding = 20;
                    const viewportWidth = window.innerWidth;
                    const viewportHeight = window.innerHeight;
                    const contentCenterX = viewportWidth / 2;
                    const avoidLeft = contentCenterX - 270;
                    const avoidRight = contentCenterX + 270;

                    let randomX, randomY, attempts = 0;
                    do {
                        randomX = Math.random() * (viewportWidth - 170) + padding;
                        randomY = Math.random() * (viewportHeight - 80) + padding;
                        attempts++;
                        if (randomX < avoidLeft || randomX > avoidRight || randomY < 100) break;
                    } while (attempts < 50);

                    setNoButtonPos({ top: randomY, left: randomX });
                }
            };

            const fireworks = useMemo(() => {
                if (!accepted) return null;
                const colors = ['red', 'blue', 'green'];
                const particles = [];
                for (let burst = 0; burst < 10; burst++) {
                    const burstX = Math.random() * 100;
                    const burstY = Math.random() * 70 + 10;
                    for (let i = 0; i < 50; i++) {
                        const angle = (Math.PI * 2 * i) / 50;
                        const distance = Math.random() * 250 + 100;
                        particles.push(
                            <div
                                key={`${burst}-${i}`}
                                className={`firework ${colors[Math.floor(Math.random() * 3)]}`}
                                style={{
                                    left: `${burstX}%`,
                                    top: `${burstY}%`,
                                    '--tx': `${Math.cos(angle) * distance}px`,
                                    '--ty': `${Math.sin(angle) * distance}px`,
                                    animationDelay: `${burst * 0.25 + Math.random() * 0.4}s`
                                }}
                            />
                        );
                    }
                }
                return particles;
            }, [accepted]);

            if (accepted) {
                return (
                    <>
                        <div className="fireworks">{fireworks}</div>
                        <div className="container">
                            <div className="success-message">
                                <div className="success-message-img-wrapper">
                                    <img src="GIFS/YES/images.png" alt="Celebration" />
                                </div>
                                <p>I'm so glad you said yes!</p>
                                <div className="quote-section">
                                    {showTypingAnimation && !typingComplete && (
                                        <div className="typing-text">
                                            {typedText}<span className="cursor"></span>
                                        </div>
                                    )}
                                    {typingComplete && (
                                        <button className="poem-button" onClick={() => setShowPoem(true)}>
                                            "I hate the way you're always right"
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                        {showPoem && (
                            <div className="poem-overlay">
                                <div className="poem-container">
                                    <p>{poem}</p>
                                </div>
                                <button className="back-button" onClick={() => setShowPoem(false)}>
                                    ← back
                                </button>
                            </div>
                        )}
                        {showMusicButton && (
                            <button ref={musicButtonRef} className="music-button" onClick={playMusic}>
                                Click to Play Music
                            </button>
                        )}
                    </>
                );
            }

            return (
                <div className="container">
                    <div className="messages-container">
                        {showTyping1 && (
                            <div className="message">
                                <div className="typing-indicator">
                                    <div className="typing-dot"></div>
                                    <div className="typing-dot"></div>
                                    <div className="typing-dot"></div>
                                </div>
                            </div>
                        )}
                        {showMessage1 && (
                            <div className="message">
                                <div className="message-bubble">Hi :)</div>
                            </div>
                        )}
                        {showTyping2 && (
                            <div className="message">
                                <div className="typing-indicator">
                                    <div className="typing-dot"></div>
                                    <div className="typing-dot"></div>
                                    <div className="typing-dot"></div>
                                </div>
                            </div>
                        )}
                        {showMessage2 && (
                            <div className="message">
                                <div className="message-bubble">wanna be my valentine?</div>
                            </div>
                        )}
                    </div>
                    <div className="gif-container">
                        <img src="GIFS/156b62223a7e50b247e77e4c8312ea6e.gif" alt="Cute animation" />
                    </div>
                    {showButtons && (
                        <div className="buttons-container">
                            <button
                                className="btn btn-yes"
                                onClick={handleYesClick}
                                style={{ transform: `scale(${1 + noClickCount * 0.3})`, zIndex: 10 }}
                            >
                                Yes!
                            </button>
                            {!isMobile && noButtonHovered && <div className="btn-placeholder">No...</div>}
                            <button
                                className={`btn btn-no ${!isMobile && noButtonHovered ? 'moving' : ''}`}
                                onClick={handleNoClick}
                                onMouseEnter={handleNoHover}
                                style={!isMobile && noButtonHovered ? { top: `${noButtonPos.top}px`, left: `${noButtonPos.left}px` } : {}}
                            >
                                No...
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<ValentineApp />);
    </script>
</body>
</html>
